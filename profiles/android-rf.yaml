profile: android-rf
description: >
  A focused radio and hardware bench: SDR, GNSS, LoRa, NFC, RFID, BLE and the
  OTG serial console. Runs on a stock device — most of this needs no privileges,
  only an adapter.
order: 3
requires_tier: 0
reversible: true

modules:
  - termux: { shell: zsh, prompt: starship, font: nerd, storage: true }
  - layout: { home: ~/wtf, widgets: true }

# Confirm USB host support before buying adapters — plenty of phones do not do
# OTG at all. The catalogue's usb-device-info entry checks it in seconds.

bundles:
  - core
  - dev
  - radio
  - wireless
  - hardware
  - reporting
